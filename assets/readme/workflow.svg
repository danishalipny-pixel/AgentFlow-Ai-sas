<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="100%" height="100%">
  <defs>
    <radialGradient id="wfBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f1122" />
      <stop offset="100%" stop-color="#05070e" />
    </radialGradient>

    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <filter id="wfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1100" height="280" rx="14" fill="url(#wfBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Flow Connector Cables -->
  <path d="M 170 140 L 230 140" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="4 4" />
  <path d="M 370 140 L 430 140" stroke="#818cf8" stroke-width="2.5" stroke-dasharray="4 4" />
  <path d="M 570 140 L 630 140" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4 4" />
  <path d="M 770 140 L 830 140" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4 4" />
  <path d="M 970 140 L 1010 140" stroke="#34d399" stroke-width="2.5" stroke-dasharray="4 4" />

  <!-- Node 1: TRIGGER -->
  <g transform="translate(40, 80)">
    <rect width="130" height="120" rx="10" fill="url(#nodeGrad)" stroke="#fbbf24" stroke-width="1.5" filter="url(#wfGlow)" />
    <circle cx="24" cy="24" r="8" fill="#d97706" />
    <path d="M22 20 L27 24 L22 28 Z" fill="#ffffff" />
    <text x="40" y="28" fill="#fef3c7" font-size="11" font-weight="700" class="sans">TRIGGER</text>
    <line x1="12" y1="44" x2="118" y2="44" stroke="#334155" />
    <text x="14" y="65" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Inbound Webhook</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9" class="mono">event: task.dispatch</text>
    <rect x="14" y="94" width="55" height="16" rx="4" fill="#78350f" opacity="0.6" />
    <text x="41" y="105" fill="#fde68a" font-size="8" font-weight="700" text-anchor="middle" class="mono">INIT</text>
  </g>

  <!-- Node 2: SUPERVISOR AGENT -->
  <g transform="translate(240, 80)">
    <rect width="130" height="120" rx="10" fill="url(#nodeGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#wfGlow)" />
    <circle cx="24" cy="24" r="8" fill="#6366f1" />
    <text x="40" y="28" fill="#e0e7ff" font-size="11" font-weight="700" class="sans">SUPERVISOR</text>
    <line x1="12" y1="44" x2="118" y2="44" stroke="#334155" />
    <text x="14" y="65" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Project Manager</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9" class="mono">Decompose Plan</text>
    <rect x="14" y="94" width="70" height="16" rx="4" fill="#312e81" opacity="0.6" />
    <text x="49" y="105" fill="#c7d2fe" font-size="8" font-weight="700" text-anchor="middle" class="mono">ORCHESTRATOR</text>
  </g>

  <!-- Node 3: WORKER AGENTS -->
  <g transform="translate(440, 80)">
    <rect width="130" height="120" rx="10" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#wfGlow)" />
    <circle cx="24" cy="24" r="8" fill="#0284c7" />
    <text x="40" y="28" fill="#e0f2fe" font-size="11" font-weight="700" class="sans">WORKERS</text>
    <line x1="12" y1="44" x2="118" y2="44" stroke="#334155" />
    <text x="14" y="65" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Research &amp; Analyst</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9" class="mono">Tool Executions</text>
    <rect x="14" y="94" width="60" height="16" rx="4" fill="#0c4a6e" opacity="0.6" />
    <text x="44" y="105" fill="#7dd3fc" font-size="8" font-weight="700" text-anchor="middle" class="mono">SANDBOX</text>
  </g>

  <!-- Node 4: APPROVAL GATE -->
  <g transform="translate(640, 80)">
    <rect width="130" height="120" rx="10" fill="url(#nodeGrad)" stroke="#f59e0b" stroke-width="1.8" filter="url(#wfGlow)" />
    <circle cx="24" cy="24" r="8" fill="#d97706" />
    <text x="40" y="28" fill="#fef3c7" font-size="11" font-weight="700" class="sans">APPROVAL</text>
    <line x1="12" y1="44" x2="118" y2="44" stroke="#334155" />
    <text x="14" y="65" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Human Review</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9" class="mono">Halt &amp; Intercept</text>
    <rect x="14" y="94" width="65" height="16" rx="4" fill="#78350f" opacity="0.6" />
    <text x="46.5" y="105" fill="#fcd34d" font-size="8" font-weight="700" text-anchor="middle" class="mono">VERIFY GATE</text>
  </g>

  <!-- Node 5: SYNTHESIS & OUTPUT -->
  <g transform="translate(840, 80)">
    <rect width="130" height="120" rx="10" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#wfGlow)" />
    <circle cx="24" cy="24" r="8" fill="#059669" />
    <text x="40" y="28" fill="#d1fae5" font-size="11" font-weight="700" class="sans">OUTPUT</text>
    <line x1="12" y1="44" x2="118" y2="44" stroke="#334155" />
    <text x="14" y="65" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Synthesized Result</text>
    <text x="14" y="82" fill="#94a3b8" font-size="9" class="mono">Trace &amp; Deliver</text>
    <rect x="14" y="94" width="60" height="16" rx="4" fill="#064e3b" opacity="0.6" />
    <text x="44" y="105" fill="#6ee7b7" font-size="8" font-weight="700" text-anchor="middle" class="mono">COMPLETE</text>
  </g>

  <!-- Flow Status Pill Banner Bottom -->
  <g transform="translate(360, 235)">
    <rect width="380" height="28" rx="14" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1" />
    <circle cx="20" cy="14" r="4.5" fill="#34d399" />
    <text x="34" y="18" fill="#c7d2fe" font-size="10" font-weight="600" class="sans">State Transition: Inbound Trigger ➜ Workers ➜ Approval ➜ Deliverable</text>
  </g>
</svg>
