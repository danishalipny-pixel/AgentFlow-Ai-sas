<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#120e29" />
      <stop offset="45%" stop-color="#090b16" />
      <stop offset="100%" stop-color="#04050a" />
    </radialGradient>

    <!-- Core Glow Gradient -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.85" />
      <stop offset="40%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#04050a" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for 3D Faces -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="goldAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Filters for Bloom & Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="deepBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .pulse-line { stroke-dasharray: 6 6; animation: dash 20s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="520" fill="url(#bgGrad)" />

  <!-- Ambient Light Orbs -->
  <circle cx="600" cy="240" r="280" fill="url(#coreGlow)" filter="url(#deepBlur)" opacity="0.65" />
  <circle cx="240" cy="180" r="160" fill="#6366f1" filter="url(#deepBlur)" opacity="0.18" />
  <circle cx="960" cy="280" r="180" fill="#06b6d4" filter="url(#deepBlur)" opacity="0.15" />

  <!-- Isometric Ground Grid -->
  <g opacity="0.14" stroke="#818cf8" stroke-width="1">
    <line x1="100" y1="360" x2="600" y2="500" />
    <line x1="200" y1="320" x2="700" y2="460" />
    <line x1="300" y1="280" x2="800" y2="420" />
    <line x1="400" y1="240" x2="900" y2="380" />
    <line x1="500" y1="200" x2="1000" y2="340" />
    <line x1="600" y1="160" x2="1100" y2="300" />

    <line x1="1100" y1="360" x2="600" y2="500" />
    <line x1="1000" y1="320" x2="500" y2="460" />
    <line x1="900" y1="280" x2="400" y2="420" />
    <line x1="800" y1="240" x2="300" y2="380" />
    <line x1="700" y1="200" x2="200" y2="340" />
    <line x1="600" y1="160" x2="100" y2="300" />
  </g>

  <!-- Orbital Data Rings -->
  <ellipse cx="600" cy="245" rx="340" ry="120" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="8 8" />
  <ellipse cx="600" cy="245" rx="220" ry="78" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.45" />
  <ellipse cx="600" cy="245" rx="140" ry="50" fill="none" stroke="#c084fc" stroke-width="2" stroke-opacity="0.7" />

  <!-- Data Flow Lines to Agents -->
  <path d="M600 245 Q 400 160 270 170" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.6" stroke-dasharray="4 4" />
  <path d="M600 245 Q 450 340 320 370" fill="none" stroke="url(#violetGrad)" stroke-width="2" opacity="0.6" stroke-dasharray="4 4" />
  <path d="M600 245 Q 780 150 910 160" fill="none" stroke="url(#violetGrad)" stroke-width="2" opacity="0.6" stroke-dasharray="4 4" />
  <path d="M600 245 Q 760 350 880 380" fill="none" stroke="url(#cyanGrad)" stroke-width="2" opacity="0.6" stroke-dasharray="4 4" />
  <path d="M600 245 L 600 95" fill="none" stroke="#e0e7ff" stroke-width="2" opacity="0.7" stroke-dasharray="3 3" />

  <!-- 3D Central AI Core -->
  <g transform="translate(600, 245)">
    <!-- Core Back Glow -->
    <circle cx="0" cy="0" r="54" fill="#7c3aed" opacity="0.35" filter="url(#glow)" />
    <circle cx="0" cy="0" r="38" fill="#4f46e5" opacity="0.5" />

    <!-- 3D Isometric Diamond Prism Core -->
    <polygon points="0,-48 38,-24 0,0 -38,-24" fill="#a78bfa" opacity="0.9" />
    <polygon points="38,-24 38,24 0,48 0,0" fill="#6d28d9" opacity="0.95" />
    <polygon points="-38,-24 0,0 0,48 -38,24" fill="#4c1d95" opacity="0.95" />

    <!-- Center Pulse Energy Point -->
    <circle cx="0" cy="0" r="14" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
  </g>

  <!-- Node 1: Supervisor Agent (Top) -->
  <g transform="translate(600, 95)">
    <circle cx="0" cy="0" r="28" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2" filter="url(#glow)" />
    <!-- Crown / Orchestrator Icon -->
    <path d="M-10 6 L-10 -4 L-4 0 L0 -8 L4 0 L10 -4 L10 6 Z" fill="#c084fc" />
    <!-- Label Card -->
    <rect x="-85" y="-55" width="170" height="26" rx="6" fill="#0f172a" stroke="#8b5cf6" stroke-width="1" opacity="0.9" />
    <text x="0" y="-38" fill="#e0e7ff" font-size="11" font-weight="700" text-anchor="middle" class="sans">PROJECT MANAGER (SUPERVISOR)</text>
  </g>

  <!-- Node 2: Research Agent (Left Upper) -->
  <g transform="translate(270, 170)">
    <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" />
    <!-- Search / Web Icon -->
    <circle cx="-2" cy="-2" r="7" fill="none" stroke="#38bdf8" stroke-width="2" />
    <line x1="4" y1="4" x2="10" y2="10" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
    <!-- Label Card -->
    <rect x="-70" y="36" width="140" height="24" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.9" />
    <text x="0" y="52" fill="#7dd3fc" font-size="10" font-weight="600" text-anchor="middle" class="sans">RESEARCH SPECIALIST</text>
  </g>

  <!-- Node 3: Developer Agent (Left Lower) -->
  <g transform="translate(320, 370)">
    <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#a855f7" stroke-width="2" filter="url(#glow)" />
    <!-- Code Brackets Icon -->
    <path d="M-7 -6 L-12 0 L-7 6 M7 -6 L12 0 L7 6 M-2 8 L2 -8" stroke="#c084fc" stroke-width="2" stroke-linecap="round" fill="none" />
    <!-- Label Card -->
    <rect x="-70" y="36" width="140" height="24" rx="6" fill="#0f172a" stroke="#a855f7" stroke-width="1" opacity="0.9" />
    <text x="0" y="52" fill="#d8b4fe" font-size="10" font-weight="600" text-anchor="middle" class="sans">DEVELOPER AGENT</text>
  </g>

  <!-- Node 4: Sales Agent (Right Upper) -->
  <g transform="translate(910, 160)">
    <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#f59e0b" stroke-width="2" filter="url(#glow)" />
    <!-- Target / Bullseye Icon -->
    <circle cx="0" cy="0" r="9" fill="none" stroke="#fbbf24" stroke-width="1.8" />
    <circle cx="0" cy="0" r="3.5" fill="#f59e0b" />
    <!-- Label Card -->
    <rect x="-70" y="36" width="140" height="24" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" opacity="0.9" />
    <text x="0" y="52" fill="#fde68a" font-size="10" font-weight="600" text-anchor="middle" class="sans">STRATEGIC SALES BOT</text>
  </g>

  <!-- Node 5: Data Analyst (Right Lower) -->
  <g transform="translate(880, 380)">
    <circle cx="0" cy="0" r="26" fill="#0f172a" stroke="#06b6d4" stroke-width="2" filter="url(#glow)" />
    <!-- Bar Chart Icon -->
    <line x1="-8" y1="7" x2="-8" y2="0" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
    <line x1="-1" y1="7" x2="-1" y2="-6" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
    <line x1="6" y1="7" x2="6" y2="-3" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" />
    <!-- Label Card -->
    <rect x="-70" y="36" width="140" height="24" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1" opacity="0.9" />
    <text x="0" y="52" fill="#67e8f9" font-size="10" font-weight="600" text-anchor="middle" class="sans">QUANT DATA ANALYST</text>
  </g>

  <!-- Holographic Floating Badge Left: Multi-Agent State -->
  <g transform="translate(90, 80)">
    <rect width="210" height="66" rx="10" fill="url(#cardGrad)" stroke="#6366f1" stroke-width="1" opacity="0.92" filter="url(#glow)" />
    <circle cx="20" cy="23" r="5" fill="#10b981" />
    <text x="34" y="27" fill="#e2e8f0" font-size="11" font-weight="700" class="sans">STATE ENGINE</text>
    <text x="175" y="27" fill="#34d399" font-size="10" font-weight="700" class="mono">ACTIVE</text>
    <line x1="14" y1="38" x2="196" y2="38" stroke="#334155" stroke-width="1" />
    <text x="14" y="53" fill="#94a3b8" font-size="9.5" class="mono">LangGraph Orchestrator v1.0</text>
  </g>

  <!-- Holographic Floating Badge Right: Human-in-the-Loop Approval -->
  <g transform="translate(900, 70)">
    <rect width="215" height="66" rx="10" fill="url(#cardGrad)" stroke="#f59e0b" stroke-width="1" opacity="0.92" filter="url(#glow)" />
    <circle cx="20" cy="23" r="5" fill="#f59e0b" />
    <text x="34" y="27" fill="#fef3c7" font-size="11" font-weight="700" class="sans">HUMAN-IN-THE-LOOP</text>
    <text x="175" y="27" fill="#fbbf24" font-size="10" font-weight="700" class="mono">GUARD</text>
    <line x1="14" y1="38" x2="201" y2="38" stroke="#334155" stroke-width="1" />
    <text x="14" y="53" fill="#94a3b8" font-size="9.5" class="mono">Sensitive Actions Verified</text>
  </g>

  <!-- Floating Metric Center Bottom: DAG Telemetry -->
  <g transform="translate(460, 440)">
    <rect width="280" height="48" rx="24" fill="#0a0c16" stroke="#4f46e5" stroke-width="1.2" opacity="0.95" />
    <circle cx="24" cy="24" r="6" fill="#6366f1" filter="url(#glow)" />
    <text x="40" y="28" fill="#e2e8f0" font-size="11" font-weight="600" class="sans">Visual DAG Pipeline:</text>
    <text x="168" y="28" fill="#38bdf8" font-size="11" font-weight="700" class="mono">7 Agents In Sync</text>
  </g>

</svg>
