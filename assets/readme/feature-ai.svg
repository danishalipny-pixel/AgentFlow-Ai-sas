<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <radialGradient id="featBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#111326" />
      <stop offset="100%" stop-color="#06070f" />
    </radialGradient>

    <linearGradient id="agentCardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="featGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="800" height="360" rx="14" fill="url(#featBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Section Title -->
  <text x="400" y="38" fill="#e0e7ff" font-size="14" font-weight="700" text-anchor="middle" class="sans" letter-spacing="1">7 BUILT-IN AUTONOMOUS AGENT ARCHETYPES</text>
  <text x="400" y="58" fill="#94a3b8" font-size="10.5" text-anchor="middle" class="sans">Pre-engineered prompts, parameter budgets, and sandboxed tool permissions</text>

  <!-- Row 1: Top 4 Cards -->
  <!-- Card 1: Research Agent -->
  <g transform="translate(30, 80)">
    <rect width="170" height="110" rx="10" fill="url(#agentCardGrad)" stroke="#38bdf8" stroke-width="1.2" filter="url(#featGlow)" />
    <circle cx="26" cy="26" r="10" fill="#0284c7" />
    <text x="46" y="29" fill="#e0f2fe" font-size="11" font-weight="700" class="sans">RESEARCH</text>
    <text x="16" y="56" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Web &amp; Knowledge RAG</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9" class="mono">• SSRF Web Fetch</text>
    <text x="16" y="90" fill="#94a3b8" font-size="9" class="mono">• Document Search</text>
  </g>

  <!-- Card 2: Sales Agent -->
  <g transform="translate(220, 80)">
    <rect width="170" height="110" rx="10" fill="url(#agentCardGrad)" stroke="#f59e0b" stroke-width="1.2" filter="url(#featGlow)" />
    <circle cx="26" cy="26" r="10" fill="#d97706" />
    <text x="46" y="29" fill="#fef3c7" font-size="11" font-weight="700" class="sans">SALES BOT</text>
    <text x="16" y="56" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Lead Scoring &amp; Outreach</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9" class="mono">• Draft Sequences</text>
    <text x="16" y="90" fill="#fbbf24" font-size="9" class="mono">• Approval Required</text>
  </g>

  <!-- Card 3: Customer Support -->
  <g transform="translate(410, 80)">
    <rect width="170" height="110" rx="10" fill="url(#agentCardGrad)" stroke="#818cf8" stroke-width="1.2" filter="url(#featGlow)" />
    <circle cx="26" cy="26" r="10" fill="#4f46e5" />
    <text x="46" y="29" fill="#e0e7ff" font-size="11" font-weight="700" class="sans">SUPPORT</text>
    <text x="16" y="56" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Knowledge Base Queries</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9" class="mono">• Ticket Escalation</text>
    <text x="16" y="90" fill="#94a3b8" font-size="9" class="mono">• Policy Explanations</text>
  </g>

  <!-- Card 4: Developer Agent -->
  <g transform="translate(600, 80)">
    <rect width="170" height="110" rx="10" fill="url(#agentCardGrad)" stroke="#a855f7" stroke-width="1.2" filter="url(#featGlow)" />
    <circle cx="26" cy="26" r="10" fill="#7e22ce" />
    <text x="46" y="29" fill="#f3e8ff" font-size="11" font-weight="700" class="sans">DEVELOPER</text>
    <text x="16" y="56" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Code Review &amp; Security</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9" class="mono">• AST Static Analysis</text>
    <text x="16" y="90" fill="#34d399" font-size="9" class="mono">• Zero-Host Execution</text>
  </g>

  <!-- Row 2: Bottom 3 Cards Centered -->
  <!-- Card 5: Marketing Agent -->
  <g transform="translate(125, 215)">
    <rect width="170" height="110" rx="10" fill="url(#agentCardGrad)" stroke="#ec4899" stroke-width="1.2" filter="url(#featGlow)" />
    <circle cx="26" cy="26" r="10" fill="#db2777" />
    <text x="46" y="29" fill="#fce7f3" font-size="11" font-weight="700" class="sans">MARKETING</text>
    <text x="16" y="56" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Campaigns &amp; Copy</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9" class="mono">• Content Calendars</text>
    <text x="16" y="90" fill="#94a3b8" font-size="9" class="mono">• SEO Strategy</text>
  </g>

  <!-- Card 6: Data Analyst -->
  <g transform="translate(315, 215)">
    <rect width="170" height="110" rx="10" fill="url(#agentCardGrad)" stroke="#06b6d4" stroke-width="1.2" filter="url(#featGlow)" />
    <circle cx="26" cy="26" r="10" fill="#0891b2" />
    <text x="46" y="29" fill="#cffafe" font-size="11" font-weight="700" class="sans">DATA ANALYST</text>
    <text x="16" y="56" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Tabular Data &amp; Metrics</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9" class="mono">• Safe Math Calculator</text>
    <text x="16" y="90" fill="#94a3b8" font-size="9" class="mono">• CSV Row Parser</text>
  </g>

  <!-- Card 7: Project Manager -->
  <g transform="translate(505, 215)">
    <rect width="170" height="110" rx="10" fill="url(#agentCardGrad)" stroke="#6366f1" stroke-width="1.4" filter="url(#featGlow)" />
    <circle cx="26" cy="26" r="10" fill="#4f46e5" />
    <text x="46" y="29" fill="#e0e7ff" font-size="11" font-weight="700" class="sans">SUPERVISOR</text>
    <text x="16" y="56" fill="#f8fafc" font-size="10" font-weight="600" class="sans">Orchestrator &amp; Routing</text>
    <text x="16" y="74" fill="#94a3b8" font-size="9" class="mono">• LangGraph StateGraph</text>
    <text x="16" y="90" fill="#c7d2fe" font-size="9" class="mono">• Subtask Delegation</text>
  </g>

</svg>
