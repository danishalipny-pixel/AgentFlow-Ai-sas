<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="100%" height="100%">
  <defs>
    <radialGradient id="archBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0f111e" />
      <stop offset="60%" stop-color="#080a12" />
      <stop offset="100%" stop-color="#04050a" />
    </radialGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="blueGlowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .mono { font-family: 'JetBrains Mono', 'Fira Code', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  </style>

  <!-- Background Canvas -->
  <rect width="1100" height="460" rx="16" fill="url(#archBg)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Grid Accents -->
  <g opacity="0.08" stroke="#818cf8" stroke-width="1">
    <line x1="50" y1="80" x2="1050" y2="80" />
    <line x1="50" y1="160" x2="1050" y2="160" />
    <line x1="50" y1="240" x2="1050" y2="240" />
    <line x1="50" y1="320" x2="1050" y2="320" />
    <line x1="50" y1="400" x2="1050" y2="400" />
  </g>

  <!-- Title Badge -->
  <g transform="translate(420, 24)">
    <rect width="260" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" />
    <text x="130" y="21" fill="#c7d2fe" font-size="11" font-weight="700" text-anchor="middle" class="sans" letter-spacing="1">SYSTEM ARCHITECTURE TOPOLOGY</text>
  </g>

  <!-- Connection Bus Lines -->
  <!-- Web to Ingress -->
  <path d="M 230 185 L 290 185" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
  <!-- Ingress to API -->
  <path d="M 430 185 L 490 185" stroke="#818cf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
  <!-- API to AI Service -->
  <path d="M 690 185 L 750 185" stroke="#a855f7" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
  <!-- API Down to Data/Redis -->
  <path d="M 590 280 L 590 340" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />
  <!-- AI Service Down to Tools -->
  <path d="M 850 280 L 850 340" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" opacity="0.8" />

  <!-- 1. Client Layer -->
  <g transform="translate(50, 90)">
    <rect width="180" height="190" rx="12" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#softGlow)" />
    <rect x="0" y="0" width="180" height="34" rx="12" fill="#0369a1" opacity="0.4" />
    <text x="16" y="22" fill="#e0f2fe" font-size="11" font-weight="700" class="sans">CLIENT SPA</text>
    <circle cx="160" cy="18" r="4" fill="#38bdf8" />
    <text x="16" y="60" fill="#94a3b8" font-size="9" font-weight="600" class="mono">PRESENTATION LAYER</text>
    <text x="16" y="85" fill="#f8fafc" font-size="11" font-weight="600" class="sans">• React 18 / Vite</text>
    <text x="16" y="110" fill="#f8fafc" font-size="11" font-weight="600" class="sans">• React Flow Canvas</text>
    <text x="16" y="135" fill="#f8fafc" font-size="11" font-weight="600" class="sans">• Tailwind / Glass UI</text>
    <text x="16" y="160" fill="#f8fafc" font-size="11" font-weight="600" class="sans">• Recharts Analytics</text>
    <rect x="16" y="174" width="70" height="18" rx="4" fill="#0284c7" opacity="0.4" />
    <text x="51" y="187" fill="#bae6fd" font-size="9" font-weight="700" text-anchor="middle" class="mono">:5200</text>
  </g>

  <!-- 2. Reverse Proxy / Ingress -->
  <g transform="translate(290, 115)">
    <rect width="140" height="140" rx="12" fill="url(#panelGrad)" stroke="#818cf8" stroke-width="1.5" />
    <rect x="0" y="0" width="140" height="30" rx="12" fill="#4338ca" opacity="0.4" />
    <text x="14" y="20" fill="#e0e7ff" font-size="11" font-weight="700" class="sans">REVERSE PROXY</text>
    <text x="14" y="55" fill="#94a3b8" font-size="9" class="mono">INGRESS / ROUTING</text>
    <text x="14" y="80" fill="#f8fafc" font-size="11" class="sans">• Nginx Gateway</text>
    <text x="14" y="102" fill="#f8fafc" font-size="11" class="sans">• SSL Termination</text>
    <text x="14" y="124" fill="#f8fafc" font-size="11" class="sans">• Gzip / CORS</text>
  </g>

  <!-- 3. Backend API Core -->
  <g transform="translate(490, 90)">
    <rect width="200" height="190" rx="12" fill="url(#panelGrad)" stroke="#6366f1" stroke-width="1.5" filter="url(#softGlow)" />
    <rect x="0" y="0" width="200" height="34" rx="12" fill="#4f46e5" opacity="0.4" />
    <text x="16" y="22" fill="#e0e7ff" font-size="11" font-weight="700" class="sans">EXPRESS API CORE</text>
    <circle cx="180" cy="18" r="4" fill="#818cf8" />
    <text x="16" y="58" fill="#94a3b8" font-size="9" class="mono">BUSINESS LOGIC</text>
    <text x="16" y="82" fill="#f8fafc" font-size="11" class="sans">• 18 REST Domains</text>
    <text x="16" y="104" fill="#f8fafc" font-size="11" class="sans">• Tenant Isolation Guard</text>
    <text x="16" y="126" fill="#f8fafc" font-size="11" class="sans">• 5-Tier RBAC Engine</text>
    <text x="16" y="148" fill="#f8fafc" font-size="11" class="sans">• Approval Queue Logic</text>
    <text x="16" y="170" fill="#f8fafc" font-size="11" class="sans">• OpenAPI / Swagger</text>
  </g>

  <!-- 4. Python AI Orchestrator -->
  <g transform="translate(750, 90)">
    <rect width="200" height="190" rx="12" fill="url(#panelGrad)" stroke="#a855f7" stroke-width="1.5" filter="url(#softGlow)" />
    <rect x="0" y="0" width="200" height="34" rx="12" fill="#7e22ce" opacity="0.4" />
    <text x="16" y="22" fill="#f3e8ff" font-size="11" font-weight="700" class="sans">AI SERVICE (PYTHON)</text>
    <circle cx="180" cy="18" r="4" fill="#c084fc" />
    <text x="16" y="58" fill="#94a3b8" font-size="9" class="mono">ORCHESTRATION ENGINE</text>
    <text x="16" y="82" fill="#f8fafc" font-size="11" class="sans">• LangGraph StateGraph</text>
    <text x="16" y="104" fill="#f8fafc" font-size="11" class="sans">• Supervisor Coordinator</text>
    <text x="16" y="126" fill="#f8fafc" font-size="11" class="sans">• 7 Domain Worker Nodes</text>
    <text x="16" y="148" fill="#f8fafc" font-size="11" class="sans">• Approval Checkpoints</text>
    <text x="16" y="170" fill="#f8fafc" font-size="11" class="sans">• Pydantic Schemas</text>
  </g>

  <!-- 5. Persistence Layer (Bottom Center) -->
  <g transform="translate(490, 340)">
    <rect width="200" height="96" rx="10" fill="url(#panelGrad)" stroke="#38bdf8" stroke-width="1.3" />
    <text x="16" y="25" fill="#38bdf8" font-size="11" font-weight="700" class="sans">PERSISTENCE &amp; CACHE</text>
    <text x="16" y="48" fill="#f8fafc" font-size="10.5" class="sans">• MongoDB (16 Tenant Models)</text>
    <text x="16" y="68" fill="#f8fafc" font-size="10.5" class="sans">• In-Memory Fallback Engine</text>
    <text x="16" y="88" fill="#f8fafc" font-size="10.5" class="sans">• Redis / BullMQ Job Queue</text>
  </g>

  <!-- 6. Tool Sandboxing (Bottom Right) -->
  <g transform="translate(750, 340)">
    <rect width="200" height="96" rx="10" fill="url(#panelGrad)" stroke="#10b981" stroke-width="1.3" />
    <text x="16" y="25" fill="#34d399" font-size="11" font-weight="700" class="sans">SANDBOXED TOOLS</text>
    <text x="16" y="48" fill="#f8fafc" font-size="10.5" class="sans">• SSRF-Guarded Web Fetch</text>
    <text x="16" y="68" fill="#f8fafc" font-size="10.5" class="sans">• Safe AST Math Calculator</text>
    <text x="16" y="88" fill="#f8fafc" font-size="10.5" class="sans">• CSV Parser &amp; Knowledge RAG</text>
  </g>

</svg>
